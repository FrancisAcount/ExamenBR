# Memoria acotada: esta equipo tiene 5.8 GB de RAM, por lo que el valor
# original (-Xmx8G) provocaba "Out of memory" en el proceso de Flutter.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
# Evita mantener daemons de Gradle en memoria entre compilaciones.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# Compila Kotlin en el propio proceso de Gradle: evita el error
# "Failed connecting to the daemon" con RAM limitada.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
