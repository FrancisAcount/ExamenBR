name: transporte_maranata
description: "Transporte Escolar Maranata - Sistema de gestión de flota, rutas y estudiantes."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1   # Tipografías profesionales (Inter) con fallback a Roboto
  url_launcher: ^6.3.0   # Apertura de WhatsApp (wa.me) y llamadas directas
  geolocator: ^14.1.1   # GPS real en tiempo real (antena del celular)
  flutter_map: ^6.1.0   # Mapa libre con OpenStreetMap (sin API Key)
  latlong2: ^0.9.0   # Coordenadas para Flutter Map
  firebase_core: ^4.15.0   # Inicializacion de Firebase (FlutterFire)
  firebase_database: ^12.6.0   # Realtime Database: buses_en_vivo/BUS-XX
  file_picker: ^13.1.0
  image: ^4.10.1
  http: ^1.6.0
  pdf: ^3.11.3
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Icono de la app (Android + Web). Se genera desde assets/icon/app_icon.png
# con: dart run tools/crear_icono.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
